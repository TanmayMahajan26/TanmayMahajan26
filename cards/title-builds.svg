<svg xmlns="http://www.w3.org/2000/svg" width="840" height="70" viewBox="0 0 840 70" role="img" aria-label="featured builds"><title>featured builds</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.up{animation:up .8s cubic-bezier(.2,.75,.25,1) backwards}.fade{animation:fade 1s ease-out backwards}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.ln{stroke-dasharray:600;animation:draw 1.4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:600}}</style><defs></defs><text x="10" y="44" font-size="20" fill="#a78bfa" font-weight="700" text-anchor="start" class="m">//</text><text x="42" y="44" font-size="20" fill="#e6ebf5" font-weight="700" text-anchor="start" class="up">featured builds</text><line class="ln" x1="240" y1="38" x2="624" y2="38" stroke="#223052" stroke-width="1.5"/><text x="830" y="42" font-size="12" fill="#5b6785" font-weight="400" text-anchor="end" class="m fade">hackathons &amp; side projects</text></svg>